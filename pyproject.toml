[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sablon"
version = "0.2.0"
description = "Yaratıcı, katlama-farkındalıklı, mm hassasiyetli kalıp tasarım aracı (deri, karton...) — PDF kitapçık, SVG, DXF, 3B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0", "anthropic>=1.0", "pydantic>=2.0", "numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[project.scripts]
sablon = "sablon.cli:main"

[tool.setuptools.packages.find]
include = ["sablon*"]

[tool.setuptools.package-data]
sablon = ["bilgi/*.md", "bilgi/kullanici/*.md"]
