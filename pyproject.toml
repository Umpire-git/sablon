[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sablon"
version = "0.3.0"
description = "Dikişsiz deri ürünler için yaratıcı, katlama-farkındalıklı, mm hassasiyetli kalıp tasarım aracı — PDF kitapçık, SVG, DXF, 3B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0", "anthropic>=1.0", "pydantic>=2.0", "numpy>=1.24", "pillow>=10.0", "google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]
foto = ["bpy"]  # yalnızca Python 3.11; yoksa normal Blender programı kullanılır

[project.scripts]
sablon = "sablon.cli:main"

[tool.setuptools.packages.find]
include = ["sablon*"]

[tool.setuptools.package-data]
sablon = ["bilgi/*.md", "bilgi/kullanici/*.md"]
