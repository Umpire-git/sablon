[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sablon"
version = "0.1.0"
description = "Parametrik, milimetre hassasiyetli kalıp/şablon üretici (deri, karton...) — PDF/SVG/DXF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0", "anthropic>=1.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[project.scripts]
sablon = "sablon.cli:main"

[tool.setuptools.packages.find]
include = ["sablon*"]
